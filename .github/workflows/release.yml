name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go-server/go.mod
          cache-dependency-path: go-server/go.sum

      - name: Build frontend & embed into Go
        run: |
          npm --prefix web ci
          npm --prefix web run build
          rm -rf go-server/webdist
          mkdir -p go-server/webdist
          cp -R web/dist/. go-server/webdist/

      - name: Test Go backend
        working-directory: go-server
        run: go test -v ./...

      - name: Cross-compile static binaries
        working-directory: go-server
        run: |
          mkdir -p dist
          for target in "linux/amd64" "linux/arm64" "darwin/arm64" "darwin/amd64"; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            OUT="dist/atlasnode-${GOOS}-${GOARCH}"
            echo "Building ${OUT}..."
            GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 \
              go build -trimpath -ldflags="-s -w" -o "$OUT" .
          done
          (cd dist && sha256sum atlasnode-* > SHA256SUMS.txt)
          ls -lh dist/

      - name: Determine Release Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: AtlasNode ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          files: |
            go-server/dist/atlasnode-*
            go-server/dist/SHA256SUMS.txt

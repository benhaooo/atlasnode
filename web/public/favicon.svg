<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#131c2e"/>
      <stop offset="100%" stop-color="#090c14"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="12" y1="10" x2="52" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="55%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.22"/>
    </linearGradient>
    <radialGradient id="glow" cx="32" cy="24" r="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded dark tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)" stroke="url(#borderGrad)" stroke-width="2"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#glow)"/>

  <!-- Subtle orbital atlas ring -->
  <circle cx="32" cy="34" r="20" stroke="#38bdf8" stroke-opacity="0.16" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Interconnected 'A' mesh legs -->
  <path d="M17.5 46L32 16.5L46.5 46" stroke="url(#strokeGrad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Crossbar telemetry link -->
  <path d="M23.5 36.5H40.5" stroke="url(#strokeGrad)" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>

  <!-- Satellite nodes -->
  <circle cx="17.5" cy="46" r="4.2" fill="#0c1220" stroke="#38bdf8" stroke-width="2.4"/>
  <circle cx="46.5" cy="46" r="4.2" fill="#0c1220" stroke="#34d399" stroke-width="2.4"/>

  <!-- Apex control-plane core node -->
  <circle cx="32" cy="16.5" r="5" fill="#38bdf8"/>
  <circle cx="32" cy="16.5" r="2" fill="#e0f2fe"/>

  <!-- Live center pulse dot on crossbar -->
  <circle cx="32" cy="36.5" r="2.6" fill="#34d399"/>
</svg>
